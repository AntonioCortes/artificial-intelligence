<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="920" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top: Cerebro (Modelos Gemini) -->
  <rect x="40" y="22" width="840" height="125" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="40" y="22" width="840" height="38" rx="14" fill="url(#headerGrad)"/>
  <text x="460" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">EL CEREBRO: Familia de Modelos Google Gemini</text>

  <!-- 3 Model Cards -->
  <rect x="65" y="72" width="245" height="62" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="187" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">⚡ Gemini Flash Lite</text>
  <text x="187" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Ultrarrápido y ligero para tareas</text>
  <text x="187" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">simples, autocompletado y subtareas</text>

  <rect x="337" y="72" width="245" height="62" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="460" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">🚀 Gemini Flash</text>
  <text x="460" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Equilibrio ideal entre gran velocidad</text>
  <text x="460" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">e inteligencia para el día a día</text>

  <rect x="610" y="72" width="245" height="62" rx="8" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
  <text x="732" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#be185d">🧠 Gemini Pro (Thinking)</text>
  <text x="732" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Máximo razonamiento profundo para</text>
  <text x="732" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">arquitectura, bugs complejos y planes</text>

  <!-- Connector Arrows -->
  <line x1="187" y1="147" x2="187" y2="188" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="460" y1="147" x2="460" y2="188" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="732" y1="147" x2="732" y2="188" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrP)"/>

  <!-- Bottom: Las 3 Superficies de Google Antigravity -->
  <text x="460" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#312e81">LAS SUPERFICIES DE GOOGLE ANTIGRAVITY (AGY) QUE USAN ESOS MODELOS</text>

  <!-- Surface 1: IDE -->
  <rect x="40" y="195" width="265" height="220" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="195" width="265" height="36" rx="12" fill="#2563eb"/>
  <text x="172" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Antigravity IDE</text>
  <text x="172" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Editor de código (basado en VS Code)</text>
  <text x="58" y="272" font-family="sans-serif" font-size="12" fill="#334155">• Autocompletado inteligente (Tab)</text>
  <text x="58" y="294" font-family="sans-serif" font-size="12" fill="#334155">• Supercomplete y Tab to Jump</text>
  <text x="58" y="316" font-family="sans-serif" font-size="12" fill="#334155">• Edición Inline (Ctrl+I / Cmd+I)</text>
  <text x="58" y="338" font-family="sans-serif" font-size="12" fill="#334155">• Chat y Agente en barra lateral</text>
  <text x="58" y="360" font-family="sans-serif" font-size="12" fill="#334155">• Code Lenses y Auto-Fix de errores</text>
  <rect x="58" y="376" width="228" height="26" rx="6" fill="#dbeafe"/>
  <text x="172" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Ideal para programar línea a línea</text>

  <!-- Surface 2: Antigravity 2.0 App -->
  <rect x="327" y="195" width="265" height="220" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="327" y="195" width="265" height="36" rx="12" fill="#7c3aed"/>
  <text x="460" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Antigravity 2.0 (App)</text>
  <text x="460" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Aplicación de escritorio para Agentes</text>
  <text x="345" y="272" font-family="sans-serif" font-size="12" fill="#334155">• Orquestación multi-proyecto</text>
  <text x="345" y="294" font-family="sans-serif" font-size="12" fill="#334155">• Chat Canvas con / y menciones @</text>
  <text x="345" y="316" font-family="sans-serif" font-size="12" fill="#334155">• Panel de Artefactos y Subagentes</text>
  <text x="345" y="338" font-family="sans-serif" font-size="12" fill="#334155">• Tareas programadas (Cron/Timers)</text>
  <text x="345" y="360" font-family="sans-serif" font-size="12" fill="#334155">• Gestión visual de Skills y MCP</text>
  <rect x="345" y="376" width="228" height="26" rx="6" fill="#ede9fe"/>
  <text x="460" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4c1d95">Ideal para dirigir agentes y proyectos</text>

  <!-- Surface 3: Antigravity CLI (agy) -->
  <rect x="615" y="195" width="265" height="220" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="615" y="195" width="265" height="36" rx="12" fill="#0d9488"/>
  <text x="747" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. Antigravity CLI (agy)</text>
  <text x="747" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e">Agente directo en tu Terminal</text>
  <text x="633" y="272" font-family="sans-serif" font-size="12" fill="#334155">• Se lanza escribiendo: agy</text>
  <text x="633" y="294" font-family="sans-serif" font-size="12" fill="#334155">• Ligero, ultrarrápido y en consola</text>
  <text x="633" y="316" font-family="sans-serif" font-size="12" fill="#334155">• Comandos /, menciones @ y Skills</text>
  <text x="633" y="338" font-family="sans-serif" font-size="12" fill="#334155">• Subagentes y tareas en background</text>
  <text x="633" y="360" font-family="sans-serif" font-size="12" fill="#334155">• Configurable en settings.json</text>
  <rect x="633" y="376" width="228" height="26" rx="6" fill="#ccfbf1"/>
  <text x="747" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#115e59">Ideal para fluir desde la terminal</text>
</svg>
