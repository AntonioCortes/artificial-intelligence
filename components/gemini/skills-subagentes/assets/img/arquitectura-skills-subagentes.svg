<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430">
  <defs>
    <marker id="arrSk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrSub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Left Side: Skills (Progressive Disclosure) -->
  <rect x="20" y="20" width="430" height="390" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="235" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">A) Cómo funcionan las SKILLS (Habilidades)</text>
  <text x="235" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6d28d9">Carga Progresiva (No gastan memoria si no se usan)</text>

  <rect x="45" y="88" width="380" height="75" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="235" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">1. Al iniciar el chat (Solo lee el catálogo)</text>
  <text x="235" y="132" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">name: desplegar-servidor</text>
  <text x="235" y="148" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">description: "Úsala cuando pidan subir a producción"</text>

  <line x1="235" y1="163" x2="235" y2="195" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrSk)"/>

  <rect x="45" y="200" width="380" height="75" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="235" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">2. Tú pides algo relacionado con esa Skill</text>
  <text x="235" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">El agente detecta que la descripción encaja</text>
  <text x="235" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">¡Activa la Skill y lee SKILL.md completo!</text>

  <line x1="235" y1="275" x2="235" y2="307" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrSk)"/>

  <rect x="45" y="312" width="380" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="235" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">3. Carpeta de la Skill (.agents/skills/mi-skill/)</text>
  <text x="235" y="355" text-anchor="middle" font-family="monospace" font-size="11" fill="#312e81">SKILL.md (Pasos) + scripts/ + examples/ + references/</text>
  <text x="235" y="375" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4c1d95">Sigue la receta paso a paso sin equivocarse</text>

  <!-- Right Side: Subagents -->
  <rect x="470" y="20" width="430" height="390" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="685" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0e7490">B) Cómo funcionan los SUBAGENTES</text>
  <text x="685" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0891b2">Delegación en paralelo con su propia ventana de contexto</text>

  <!-- Main Agent -->
  <rect x="545" y="88" width="280" height="68" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="685" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0e7490">Agente Principal (Tu Chat)</text>
  <text x="685" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Coordina el plan y delega subtareas pesadas</text>

  <line x1="595" y1="156" x2="545" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrSub)"/>
  <line x1="685" y1="156" x2="685" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrSub)"/>
  <line x1="775" y1="156" x2="825" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrSub)"/>

  <!-- 3 Subagents -->
  <rect x="485" y="210" width="122" height="105" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="485" y="210" width="122" height="28" rx="8" fill="#0891b2"/>
  <text x="546" y="229" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">research</text>
  <text x="546" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Explora 50</text>
  <text x="546" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">archivos y web</text>
  <text x="546" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">en solo-lectura</text>

  <rect x="624" y="210" width="122" height="105" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="624" y="210" width="122" height="28" rx="8" fill="#0891b2"/>
  <text x="685" y="229" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">self / custom</text>
  <text x="685" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Programa un</text>
  <text x="685" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">módulo entero</text>
  <text x="685" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">en paralelo</text>

  <rect x="763" y="210" width="122" height="105" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="763" y="210" width="122" height="28" rx="8" fill="#0891b2"/>
  <text x="824" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">image-generator</text>
  <text x="824" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Genera o edita</text>
  <text x="824" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">imágenes y</text>
  <text x="824" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">recursos visuales</text>

  <!-- Result Box -->
  <rect x="490" y="330" width="390" height="62" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="685" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#155e75">Ventaja clave de los Subagentes:</text>
  <text x="685" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#164e63">Hacen el trabajo sucio aparte y devuelven solo el resultado limpio.</text>
</svg>
