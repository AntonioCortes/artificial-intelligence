<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Cómo procesa la información un Modelo de Lenguaje (LLM)</text>

  <!-- Step 1: Prompt -->
  <rect x="25" y="70" width="180" height="140" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="25" y="70" width="180" height="36" rx="12" fill="#3b82f6"/>
  <text x="115" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Tu Prompt (Texto)</text>
  <text x="115" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">"Crea una función</text>
  <text x="115" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">en Python que</text>
  <text x="115" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">sume dos números"</text>
  <text x="115" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Entrada en lenguaje natural</text>

  <line x1="205" y1="140" x2="240" y2="140" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Tokenización -->
  <rect x="245" y="70" width="190" height="140" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="245" y="70" width="190" height="36" rx="12" fill="#8b5cf6"/>
  <text x="340" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Tokenización</text>
  <rect x="258" y="118" width="48" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="282" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">Crea</text>
  <rect x="312" y="118" width="44" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="334" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">una</text>
  <rect x="362" y="118" width="60" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="392" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">función</text>
  <text x="340" y="168" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">[1042, 315, 8912, ...]</text>
  <text x="340" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">1 Token ≈ 3/4 de palabra</text>

  <line x1="435" y1="140" x2="470" y2="140" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Ventana de Contexto + Red Neuronal -->
  <rect x="475" y="70" width="205" height="140" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <rect x="475" y="70" width="205" height="36" rx="12" fill="#0d9488"/>
  <text x="577" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. Ventana de Contexto</text>
  <text x="577" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e">Memoria de trabajo activa</text>
  <text x="577" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Historial + Archivos (@) +</text>
  <text x="577" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Reglas + Tu Prompt actual</text>
  <text x="577" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Capacidad: 200K a +1M tokens</text>

  <line x1="680" y1="140" x2="715" y2="140" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Predicción Token a Token -->
  <rect x="720" y="70" width="175" height="140" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="720" y="70" width="175" height="36" rx="12" fill="#f59e0b"/>
  <text x="807" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4. Generación</text>
  <text x="807" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">def sumar(a, b):</text>
  <text x="807" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">  return a + b</text>
  <text x="807" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">Predice el siguiente</text>
  <text x="807" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">token más probable</text>

  <!-- Bottom note box -->
  <rect x="25" y="235" width="870" height="100" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="460" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e1b4b">Concepto Clave: La Ventana de Contexto es como la Memoria RAM de la conversación</text>
  <text x="460" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#312e81">Todo lo que hablas con la IA y los archivos que lee ocupan espacio (tokens) en su ventana de contexto.</text>
  <text x="460" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#312e81">Si la conversación se vuelve gigante, conviene usar el comando /compact o abrir un chat nuevo para mantener la máxima precisión.</text>
</svg>
