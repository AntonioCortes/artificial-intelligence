<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadowG1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="920" height="340" rx="14" fill="url(#bgGradG1)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Cómo Importar Repositorios de Skills (SKILL.md) en Google Antigravity</text>

  <!-- Box 1: Repositorios Públicos -->
  <rect x="25" y="60" width="260" height="250" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadowG1)"/>
  <rect x="25" y="60" width="260" height="38" rx="10" fill="#3b82f6"/>
  <text x="155" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">1. Repositorios Abiertos (GitHub)</text>
  <text x="40" y="122" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">• anthropics/skills</text>
  <text x="50" y="140" font-family="sans-serif" font-size="11" fill="#475569">Web, Testing, Docs, PDF, MCP Builder</text>
  <text x="40" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">• vercel-labs/agent-skills</text>
  <text x="50" y="183" font-family="sans-serif" font-size="11" fill="#475569">React, Next.js, Tailwind, Web Perf</text>
  <text x="40" y="208" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">• supabase/agent-skills</text>
  <text x="50" y="226" font-family="sans-serif" font-size="11" fill="#475569">PostgreSQL, RLS, Migraciones SQL</text>
  <text x="40" y="251" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">• obra/superpowers y trailofbits</text>
  <text x="50" y="269" font-family="sans-serif" font-size="11" fill="#475569">TDD, Debugging, Auditoría Seguridad</text>
  <text x="155" y="296" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#2563eb">Estándar universal: carpeta + SKILL.md</text>

  <!-- Arrow 1 -->
  <path d="M 290 185 L 330 185" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowG1)"/>
  <polygon points="328,179 340,185 328,191" fill="#3b82f6"/>

  <!-- Box 2: Dónde se registran en Antigravity -->
  <rect x="345" y="60" width="265" height="250" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadowG1)"/>
  <rect x="345" y="60" width="265" height="38" rx="10" fill="#8b5cf6"/>
  <text x="477" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">2. Registro en Antigravity (AGY)</text>
  <rect x="360" y="112" width="235" height="54" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="372" y="132" font-family="monospace" font-size="12" font-weight="bold" fill="#5b21b6">.agents/skills/&lt;nombre&gt;/</text>
  <text x="372" y="150" font-family="sans-serif" font-size="11" fill="#475569">Para un proyecto concreto (en Git)</text>
  <rect x="360" y="176" width="235" height="54" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="372" y="196" font-family="monospace" font-size="12" font-weight="bold" fill="#5b21b6">~/.gemini/config/skills/</text>
  <text x="372" y="214" font-family="sans-serif" font-size="11" fill="#475569">Global para todos tus proyectos</text>
  <rect x="360" y="240" width="235" height="56" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="372" y="260" font-family="monospace" font-size="12" font-weight="bold" fill="#5b21b6">.agents/skills.json</text>
  <text x="372" y="278" font-family="sans-serif" font-size="11" fill="#475569">Filtra con include_only / exclude</text>

  <!-- Arrow 2 -->
  <path d="M 615 185 L 655 185" stroke="#8b5cf6" stroke-width="2.5"/>
  <polygon points="653,179 665,185 653,191" fill="#8b5cf6"/>

  <!-- Box 3: Activación en el Agente -->
  <rect x="670" y="60" width="225" height="250" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadowG1)"/>
  <rect x="670" y="60" width="225" height="38" rx="10" fill="#10b981"/>
  <text x="782" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">3. Carga Bajo Demanda</text>
  <text x="685" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46">1. Comando /skills</text>
  <text x="685" y="142" font-family="sans-serif" font-size="11" fill="#475569">Lista todas las skills activas</text>
  <text x="685" y="174" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46">2. Progressive Disclosure</text>
  <text x="685" y="192" font-family="sans-serif" font-size="11" fill="#475569">Solo inyecta name + description</text>
  <text x="685" y="208" font-family="sans-serif" font-size="11" fill="#475569">al inicio (0 gasto de contexto)</text>
  <text x="685" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46">3. Ejecución Experta</text>
  <text x="685" y="258" font-family="sans-serif" font-size="11" fill="#475569">Lee SKILL.md + scripts/ solo</text>
  <text x="685" y="274" font-family="sans-serif" font-size="11" fill="#475569">cuando tu tarea lo necesita</text>
</svg>
