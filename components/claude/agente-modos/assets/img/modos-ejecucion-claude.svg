<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <marker id="arrCl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97757"/>
    </marker>
  </defs>
  <rect width="920" height="390" rx="16" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Los 3 Modos de Operación en Claude Code (Alternables con Shift + Tab)</text>

  <!-- Mode 1: Plan Mode -->
  <rect x="30" y="65" width="265" height="225" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <rect x="30" y="65" width="265" height="36" rx="12" fill="#0891b2"/>
  <text x="162" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Plan Mode (Solo Lectura)</text>
  <text x="162" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0e7490">Fase de Investigación y Diseño</text>
  <text x="48" y="144" font-family="sans-serif" font-size="12" fill="#334155">✓ Lee archivos y explora carpetas</text>
  <text x="48" y="166" font-family="sans-serif" font-size="12" fill="#334155">✓ Busca referencias en el código</text>
  <text x="48" y="188" font-family="sans-serif" font-size="12" fill="#dc2626">✗ NO modifica ningún archivo</text>
  <text x="48" y="210" font-family="sans-serif" font-size="12" fill="#dc2626">✗ NO ejecuta comandos destructivos</text>
  <rect x="48" y="232" width="228" height="42" rx="6" fill="#cffafe"/>
  <text x="162" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#155e75">Úsalo SIEMPRE al empezar una</text>
  <text x="162" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#155e75">tarea grande para acordar el plan</text>

  <line x1="295" y1="175" x2="322" y2="175" stroke="#d97757" stroke-width="2.5" marker-end="url(#arrCl)"/>

  <!-- Mode 2: Normal / Ask Mode -->
  <rect x="327" y="65" width="265" height="225" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <rect x="327" y="65" width="265" height="36" rx="12" fill="#d97757"/>
  <text x="460" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Modo Normal (Por Defecto)</text>
  <text x="460" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9a3412">Control Paso a Paso con Confirmación</text>
  <text x="345" y="144" font-family="sans-serif" font-size="12" fill="#334155">✓ Lee archivos libremente</text>
  <text x="345" y="166" font-family="sans-serif" font-size="12" fill="#b45309">? Pide permiso antes de editar</text>
  <text x="345" y="188" font-family="sans-serif" font-size="12" fill="#b45309">? Pide permiso antes de usar Bash</text>
  <text x="345" y="210" font-family="sans-serif" font-size="12" fill="#334155">✓ Muestra el Diff (verde/rojo)</text>
  <rect x="345" y="232" width="228" height="42" rx="6" fill="#ffedd5"/>
  <text x="460" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">Ideal mientras aprendes o en</text>
  <text x="460" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">partes delicadas del proyecto</text>

  <line x1="592" y1="175" x2="619" y2="175" stroke="#d97757" stroke-width="2.5" marker-end="url(#arrCl)"/>

  <!-- Mode 3: Auto-Accept Edits -->
  <rect x="625" y="65" width="265" height="225" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="625" y="65" width="265" height="36" rx="12" fill="#16a34a"/>
  <text x="757" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. Auto-Accept Edits</text>
  <text x="757" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">Ejecución Fluida tras aprobar el Plan</text>
  <text x="643" y="144" font-family="sans-serif" font-size="12" fill="#334155">✓ Crea y edita archivos sin parar</text>
  <text x="643" y="166" font-family="sans-serif" font-size="12" fill="#334155">✓ Avanza por todos los componentes</text>
  <text x="643" y="188" font-family="sans-serif" font-size="12" fill="#b45309">? Sigue avisando en comandos</text>
  <text x="643" y="210" font-family="sans-serif" font-size="12" fill="#b45309">  de terminal no autorizados</text>
  <rect x="643" y="232" width="228" height="42" rx="6" fill="#dcfce7"/>
  <text x="757" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">Ideal para que ejecute un plan</text>
  <text x="757" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">de 15 archivos de un tirón</text>

  <!-- Bottom Tip Box -->
  <rect x="30" y="310" width="860" height="60" rx="10" fill="#1e293b"/>
  <text x="460" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Flujo de Trabajo Profesional en Claude Code: Pulsa [Shift + Tab] para cambiar de modo al instante</text>
  <text x="460" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">1º Empieza en Plan Mode para diseñar la solución → 2º Cuando te convenza el plan, pulsa Shift+Tab para pasar a Auto-Accept y que lo programe todo.</text>
</svg>
