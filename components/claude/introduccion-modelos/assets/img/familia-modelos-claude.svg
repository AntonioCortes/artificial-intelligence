<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="16" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>

  <!-- Top Header -->
  <rect x="30" y="20" width="860" height="40" rx="10" fill="url(#claudeGrad)"/>
  <text x="460" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">LA FAMILIA DE MODELOS DE CLAUDE (Anthropic) Y SUS SUPERFICIES</text>

  <!-- 3 Model Cards -->
  <rect x="30" y="78" width="270" height="155" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <rect x="30" y="78" width="270" height="34" rx="12" fill="#10b981"/>
  <text x="165" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Claude Haiku</text>
  <text x="165" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857">⚡ Velocidad Instantánea</text>
  <text x="165" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• El más rápido y económico</text>
  <text x="165" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Ideal para dudas cortas, clasificar</text>
  <text x="165" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">texto y subagentes de exploración</text>
  <rect x="50" y="200" width="230" height="22" rx="5" fill="#d1fae5"/>
  <text x="165" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46">Coste bajo · Respuesta al instante</text>

  <rect x="325" y="78" width="270" height="155" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <rect x="325" y="78" width="270" height="34" rx="12" fill="#d97757"/>
  <text x="460" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Claude Sonnet</text>
  <text x="460" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9a3412">🚀 Equilibrio Perfecto (El Rey)</text>
  <text x="460" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Modelo principal en Claude Code</text>
  <text x="460" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Excelente programando y editando</text>
  <text x="460" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Rápido y sumamente inteligente</text>
  <rect x="345" y="200" width="230" height="22" rx="5" fill="#ffedd5"/>
  <text x="460" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">Recomendado para el 90% del trabajo</text>

  <rect x="620" y="78" width="270" height="155" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="620" y="78" width="270" height="34" rx="12" fill="#7c3aed"/>
  <text x="755" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. Claude Opus</text>
  <text x="755" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">🧠 Inteligencia y Profundidad Máxima</text>
  <text x="755" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Para problemas de alta complejidad</text>
  <text x="755" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Diseño de arquitectura y bugs difíciles</text>
  <text x="755" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">• Razonamiento analítico exhaustivo</text>
  <rect x="640" y="200" width="230" height="22" rx="5" fill="#ede9fe"/>
  <text x="755" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4c1d95">Máxima potencia · Tareas críticas</text>

  <!-- Extended Thinking Banner -->
  <rect x="30" y="248" width="860" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="271" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">💡 Modo Extended Thinking (Pensamiento Extendido en Sonnet y Opus)</text>
  <text x="460" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">Permite a Claude dedicar tiempo extra a pensar paso a paso antes de responder (en Claude Code puedes activarlo o pedir "ultrathink").</text>

  <!-- Bottom 2 Surfaces -->
  <rect x="30" y="315" width="418" height="85" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="239" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">A) Claude Web / Desktop (claude.ai)</text>
  <text x="239" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Interfaz visual con Artifacts (previsualización en vivo),</text>
  <text x="239" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Projects (documentos compartidos) y conectores MCP.</text>

  <rect x="472" y="315" width="418" height="85" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="681" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9a3412">B) Claude Code (Terminal + Extensión IDE)</text>
  <text x="681" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">El Agente de desarrollo que vive en tu carpeta local,</text>
  <text x="681" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">edita tus archivos, usa Bash, Skills, Subagentes y MCP.</text>
</svg>
