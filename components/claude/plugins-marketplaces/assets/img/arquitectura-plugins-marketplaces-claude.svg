<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 355" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadowC2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="920" height="355" rx="14" fill="url(#bgGradC2)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="460" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7c2d12">Marketplaces Oficiales y Anatomía de un Plugin en Claude Code</text>

  <!-- Left: Marketplaces -->
  <rect x="25" y="58" width="285" height="270" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadowC2)"/>
  <rect x="25" y="58" width="285" height="38" rx="10" fill="#ea580c"/>
  <text x="167" y="82" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">Marketplaces Oficiales y Comunidad</text>

  <rect x="38" y="108" width="258" height="48" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="48" y="126" font-family="monospace" font-size="11.5" font-weight="bold" fill="#9a3412">claude-plugins-official</text>
  <text x="48" y="143" font-family="sans-serif" font-size="10.5" fill="#475569">anthropics/claude-plugins-official (Por defecto)</text>

  <rect x="38" y="164" width="258" height="48" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="48" y="182" font-family="monospace" font-size="11.5" font-weight="bold" fill="#9a3412">anthropics/skills</text>
  <text x="48" y="199" font-family="sans-serif" font-size="10.5" fill="#475569">Packs oficiales de Skills de Anthropic</text>

  <rect x="38" y="220" width="258" height="48" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="48" y="238" font-family="monospace" font-size="11.5" font-weight="bold" fill="#9a3412">anthropics/claude-code</text>
  <text x="48" y="255" font-family="sans-serif" font-size="10.5" fill="#475569">commit-commands, pr-review, security, hookify</text>

  <rect x="38" y="276" width="258" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="48" y="294" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">+ Marketplaces de Comunidad / Git</text>
  <text x="48" y="309" font-family="monospace" font-size="10" fill="#475569">/plugin marketplace add owner/repo</text>

  <!-- Arrow -->
  <path d="M 315 193 L 365 193" stroke="#ea580c" stroke-width="2.5"/>
  <polygon points="363,187 375,193 363,199" fill="#ea580c"/>
  <text x="345" y="180" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#9a3412">/plugin</text>
  <text x="345" y="210" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#9a3412">install</text>

  <!-- Right: What a Claude Plugin Contains -->
  <rect x="380" y="58" width="515" height="270" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadowC2)"/>
  <rect x="380" y="58" width="515" height="38" rx="10" fill="#2563eb"/>
  <text x="637" y="82" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">Contenido de un Plugin en Claude (.claude-plugin/plugin.json)</text>

  <rect x="398" y="110" width="230" height="62" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="130" font-family="monospace" font-size="12" font-weight="bold" fill="#1d4ed8">skills/ y commands/</text>
  <text x="410" y="148" font-family="sans-serif" font-size="11" fill="#334155">Nuevas habilidades automáticas</text>
  <text x="410" y="162" font-family="sans-serif" font-size="11" fill="#334155">y comandos / listos para usar.</text>

  <rect x="645" y="110" width="232" height="62" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="657" y="130" font-family="monospace" font-size="12" font-weight="bold" fill="#1d4ed8">agents/ (*.md)</text>
  <text x="657" y="148" font-family="sans-serif" font-size="11" fill="#334155">Subagentes especializados (ej.</text>
  <text x="657" y="162" font-family="sans-serif" font-size="11" fill="#334155">revisor de PRs, arquitecto, QA).</text>

  <rect x="398" y="182" width="230" height="62" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="202" font-family="monospace" font-size="12" font-weight="bold" fill="#1d4ed8">.mcp.json (Servidores MCP)</text>
  <text x="410" y="220" font-family="sans-serif" font-size="11" fill="#334155">Arranca conectores a Playwright,</text>
  <text x="410" y="234" font-family="sans-serif" font-size="11" fill="#334155">Postgres, GitHub, Sentry, Docker...</text>

  <rect x="645" y="182" width="232" height="62" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="657" y="202" font-family="monospace" font-size="12" font-weight="bold" fill="#1d4ed8">hooks/hooks.json</text>
  <text x="657" y="220" font-family="sans-serif" font-size="11" fill="#334155">Guardarraíles automáticos antes</text>
  <text x="657" y="234" font-family="sans-serif" font-size="11" fill="#334155">o después de editar o usar Bash.</text>

  <rect x="398" y="254" width="479" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="274" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">lsp.json + output-styles/ + themes/ + workflows/</text>
  <text x="410" y="294" font-family="sans-serif" font-size="11" fill="#334155">Servidores de lenguaje (LSP para ir a definición/tipos), estilos de salida y flujos de trabajo.</text>
</svg>
